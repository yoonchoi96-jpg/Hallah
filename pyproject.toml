[project]
name = "hallah"
version = "0.1.0"
description = "AI-native music production environment with a conversational Executive Producer."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["apps*", "core*", "audio*", "agent*", "plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true


[[tool.mypy.overrides]]
module = ["core.analysis.wav"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

[tool.ruff.lint.per-file-ignores]
"core/analysis/wav.py" = ["RUF046"]
"audio/processing/dynamic_masking.py" = ["RUF046"]
"audio/rendering/mock.py" = ["RUF046"]
"audio/rendering/source.py" = ["RUF046"]
